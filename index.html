<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fleet-manager/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Manager</title>
    <!-- Runtime-конфиг: правится в dist/config.js без пересборки. Должен грузиться ДО bundle.
         Путь без base: Vite сам добавит /fleet-manager/ и в dev, и в сборке (с %BASE_URL% было бы дважды). -->
    <script src="/config.js"></script>
    <script>
      // GitHub Pages SPA fallback restore — decodes ?/path/... back to /path/...
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script>
      // Тема до первого кадра (та же логика, что в useTheme), чтобы заставка
      // и приложение не мигали белым в тёмной теме.
      ;(function () {
        var mode = 'system'
        try {
          mode = localStorage.getItem('fm.theme') || 'system'
        } catch (_) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <style>
      /* Заставка при загрузке. Убирается из main.js (window.__hideSplash). */
      #fm-splash {
        --sp-bg: #f8fafc;
        --sp-grid: rgba(30, 64, 175, 0.07);
        --sp-dial: #cbd5e1;
        --sp-dial-major: #64748b;
        --sp-road: #dbe3ee;
        --sp-road-edge: #b8c4d4;
        --sp-flow: #3b82f6;
        --sp-node: #475569;
        --sp-text: #64748b;
        --sp-word-a: #1e3a8a;
        --sp-word-b: #2563eb;
        --sp-track: #e2e8f0;
        --sp-sweep: rgba(59, 130, 246, 0.14);
        --sp-accent: #f97316;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          linear-gradient(var(--sp-grid) 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(90deg, var(--sp-grid) 1px, transparent 1px) 0 0 / 32px 32px,
          var(--sp-bg);
        font-family: Inter, system-ui, sans-serif;
        transition: opacity 450ms ease, visibility 0s linear 450ms;
      }
      .dark #fm-splash {
        --sp-bg: #020617;
        --sp-grid: rgba(96, 165, 250, 0.06);
        --sp-dial: #1e293b;
        --sp-dial-major: #475569;
        --sp-road: #0f172a;
        --sp-road-edge: #1e293b;
        --sp-flow: #60a5fa;
        --sp-node: #94a3b8;
        --sp-text: #94a3b8;
        --sp-word-a: #bfdbfe;
        --sp-word-b: #60a5fa;
        --sp-track: #1e293b;
        --sp-sweep: rgba(96, 165, 250, 0.16);
      }
      /* Сетка «чертежа» гаснет к краям экрана. */
      #fm-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, transparent 0, transparent 260px, var(--sp-bg) 600px);
        pointer-events: none;
      }
      #fm-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
      }
      #fm-splash.is-leaving .fm-sp-scene {
        transform: scale(1.06);
      }
      /* Сцена нарисована в координатах 320×320 (пути роботов в offset-path — тоже),
         поэтому увеличиваем её целиком через scale, а место под неё — отступами. */
      .fm-sp-scene {
        position: relative;
        width: 320px;
        height: 320px;
        scale: 1.25;
        margin: 40px 0;
        transition: transform 450ms ease;
      }
      @media (max-width: 480px), (max-height: 640px) {
        .fm-sp-scene {
          scale: 1;
          margin: 0;
        }
      }
      .fm-sp-scene svg {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .fm-sp-sweep {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, var(--sp-sweep) 70deg, transparent 70deg);
        animation: fm-sp-spin 3.2s linear infinite;
      }
      .fm-sp-dial {
        transform-origin: 160px 160px;
        animation: fm-sp-settle 2.4s cubic-bezier(0.3, 0.7, 0.3, 1) both;
      }
      .fm-sp-flow {
        stroke-dasharray: 2 12;
        animation: fm-sp-flow 1s linear infinite;
      }
      /* Все сценки челноков, подсветки маршрутов и станций — на одном 10-секундном цикле,
         чтобы роботы проходили перекрёсток по очереди. */
      .fm-sp-robot,
      .fm-sp-plan,
      .fm-sp-plan path,
      .fm-sp-glow {
        animation-duration: 10s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      /* Робот (public/splash/robot*.svg) смотрит вверх, поэтому к направлению пути +90°.
         Вокруг корпуса в спрайте — свечение сканера, поэтому картинка больше самого робота. */
      .fm-sp-robot {
        position: absolute;
        top: 0;
        left: 0;
        width: 34px;
        height: 34px;
        offset-anchor: 50% 50%;
        offset-rotate: auto 90deg;
        filter: drop-shadow(0 2px 2px rgba(15, 23, 42, 0.3));
        opacity: 0;
        transition: opacity 300ms ease;
      }
      .fm-sp-robot.is-ready {
        opacity: 1;
      }
      .fm-sp-robot--loop {
        offset-path: path('M 88 80 H 232 A 28 28 0 0 1 260 108 V 212 A 28 28 0 0 1 232 240 H 88 A 28 28 0 0 1 60 212 V 108 A 28 28 0 0 1 88 80 Z');
        animation-name: fm-sp-drive;
      }
      .fm-sp-robot--loop2 {
        animation-delay: -5s;
      }
      /* Челнок зарядка ↔ погрузка по поперечной дороге. */
      .fm-sp-robot--x {
        offset-path: path('M 112 160 H 208');
        animation-name: fm-sp-shuttle-x;
        animation-timing-function: ease-in-out;
      }
      /* Челнок по вертикальной дороге. */
      .fm-sp-robot--y {
        offset-path: path('M 160 112 V 208');
        animation-name: fm-sp-shuttle-y;
        animation-timing-function: ease-in-out;
      }
      .fm-sp-plan {
        opacity: 0;
      }
      .fm-sp-plan path {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
      }
      .fm-sp-plan--x-go { animation-name: fm-sp-plan-x-go; }
      .fm-sp-plan--x-go path { animation-name: fm-sp-draw-x-go; }
      .fm-sp-plan--x-back { animation-name: fm-sp-plan-x-back; }
      .fm-sp-plan--x-back path { animation-name: fm-sp-draw-x-back; }
      .fm-sp-plan--y-down { animation-name: fm-sp-plan-y-down; }
      .fm-sp-plan--y-down path { animation-name: fm-sp-draw-y-down; }
      .fm-sp-plan--y-up { animation-name: fm-sp-plan-y-up; }
      .fm-sp-plan--y-up path { animation-name: fm-sp-draw-y-up; }
      .fm-sp-glow {
        opacity: 0;
        animation-timing-function: ease-in-out;
      }
      .fm-sp-glow--charge { animation-name: fm-sp-glow-charge; }
      .fm-sp-glow--load { animation-name: fm-sp-glow-load; }
      .fm-sp-brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        animation: fm-sp-rise 600ms 150ms ease both;
      }
      .fm-sp-word {
        font-family: Michroma, Inter, system-ui, sans-serif;
        font-size: 26px;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background-image: linear-gradient(90deg, var(--sp-word-a), var(--sp-word-b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .fm-sp-bar {
        width: 3px;
        height: 30px;
        border-radius: 3px;
        background: var(--sp-accent);
      }
      .fm-sp-sub {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--sp-text);
      }
      .fm-sp-progress {
        position: relative;
        width: 220px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--sp-track);
        animation: fm-sp-rise 600ms 250ms ease both;
      }
      .fm-sp-progress::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--sp-word-b) 60%, var(--sp-accent));
        animation: fm-sp-load 1.3s ease-in-out infinite;
      }
      .fm-sp-status {
        position: relative;
        margin-top: -16px;
        min-height: 16px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--sp-text);
        animation: fm-sp-rise 600ms 300ms ease both;
      }
      @keyframes fm-sp-spin {
        to { transform: rotate(360deg); }
      }
      /* Стрелка компаса «ищет» север и успокаивается. */
      @keyframes fm-sp-settle {
        0% { transform: rotate(-120deg); opacity: 0; }
        35% { transform: rotate(28deg); opacity: 1; }
        55% { transform: rotate(-12deg); }
        72% { transform: rotate(5deg); }
        86% { transform: rotate(-2deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes fm-sp-flow {
        to { stroke-dashoffset: -14; }
      }
      @keyframes fm-sp-drive {
        from { offset-distance: 0%; }
        to { offset-distance: 100%; }
      }
      /* Челнок X: заряжается → едет на погрузку → разворот → обратно → разворот. */
      @keyframes fm-sp-shuttle-x {
        0%, 15% { offset-distance: 0%; offset-rotate: auto 90deg; }
        35% { offset-distance: 100%; offset-rotate: auto 90deg; }
        45%, 55% { offset-distance: 100%; offset-rotate: auto -90deg; }
        75% { offset-distance: 0%; offset-rotate: auto -90deg; }
        85%, 100% { offset-distance: 0%; offset-rotate: auto 90deg; }
      }
      /* Челнок Y пересекает центр, пока X стоит на станциях. */
      @keyframes fm-sp-shuttle-y {
        0% { offset-distance: 0%; offset-rotate: auto -90deg; }
        8%, 35% { offset-distance: 0%; offset-rotate: auto 90deg; }
        55% { offset-distance: 100%; offset-rotate: auto 90deg; }
        63%, 80% { offset-distance: 100%; offset-rotate: auto -90deg; }
        100% { offset-distance: 0%; offset-rotate: auto -90deg; }
      }
      @keyframes fm-sp-plan-x-go { 0%, 7%, 37%, 100% { opacity: 0; } 9%, 33% { opacity: 1; } }
      @keyframes fm-sp-draw-x-go { 0%, 8% { stroke-dashoffset: 100; } 15%, 100% { stroke-dashoffset: 0; } }
      @keyframes fm-sp-plan-x-back { 0%, 47%, 77%, 100% { opacity: 0; } 49%, 73% { opacity: 1; } }
      @keyframes fm-sp-draw-x-back { 0%, 48% { stroke-dashoffset: 100; } 55%, 100% { stroke-dashoffset: 0; } }
      @keyframes fm-sp-plan-y-down { 0%, 27%, 57%, 100% { opacity: 0; } 29%, 53% { opacity: 1; } }
      @keyframes fm-sp-draw-y-down { 0%, 28% { stroke-dashoffset: 100; } 35%, 100% { stroke-dashoffset: 0; } }
      @keyframes fm-sp-plan-y-up { 0%, 72%, 100% { opacity: 0; } 74%, 97% { opacity: 1; } }
      @keyframes fm-sp-draw-y-up { 0%, 73% { stroke-dashoffset: 100; } 80%, 100% { stroke-dashoffset: 0; } }
      @keyframes fm-sp-glow-charge { 0%, 12%, 88%, 100% { opacity: 0.45; } 6%, 82%, 94% { opacity: 0.15; } 16%, 84% { opacity: 0; } }
      @keyframes fm-sp-glow-load { 0%, 35%, 57%, 100% { opacity: 0; } 40%, 52% { opacity: 0.45; } 46% { opacity: 0.15; } }
      @keyframes fm-sp-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes fm-sp-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #fm-splash *,
        #fm-splash *::after {
          animation: none !important;
        }
        .fm-sp-robot--loop { offset-distance: 12%; }
        .fm-sp-robot--loop2 { offset-distance: 62%; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="fm-splash" role="status" aria-live="polite" aria-label="Loading Compass Fleet Control">
      <div class="fm-sp-scene" aria-hidden="true">
        <div class="fm-sp-sweep"></div>
        <svg width="320" height="320" viewBox="0 0 320 320">
          <!-- Циферблат компаса -->
          <g class="fm-sp-dial">
            <circle cx="160" cy="160" r="154" fill="none" stroke="var(--sp-dial)" stroke-width="1.5" />
            <circle cx="160" cy="160" r="141" fill="none" stroke="var(--sp-dial)" stroke-width="1" stroke-dasharray="1.5 10.8" />
            <g stroke="var(--sp-dial-major)" stroke-width="2" stroke-linecap="round">
              <line x1="160" y1="6" x2="160" y2="18" stroke="var(--sp-accent)" />
              <line x1="314" y1="160" x2="302" y2="160" />
              <line x1="160" y1="314" x2="160" y2="302" />
              <line x1="6" y1="160" x2="18" y2="160" />
            </g>
            <path d="M160 -6 L166 4 H154 Z" fill="var(--sp-accent)" />
            <text x="160" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="var(--sp-accent)" font-family="Inter, system-ui, sans-serif">N</text>
          </g>

          <!-- Дороги: кольцо, поперечная (зарядка ↔ погрузка) и вертикальная -->
          <g fill="none" stroke-linejoin="round" stroke-linecap="round">
            <g stroke="var(--sp-road-edge)" stroke-width="16">
              <path d="M 88 80 H 232 A 28 28 0 0 1 260 108 V 212 A 28 28 0 0 1 232 240 H 88 A 28 28 0 0 1 60 212 V 108 A 28 28 0 0 1 88 80 Z" />
              <path d="M 84 160 H 236" />
              <path d="M 160 80 V 240" />
            </g>
            <g stroke="var(--sp-road)" stroke-width="13">
              <path d="M 88 80 H 232 A 28 28 0 0 1 260 108 V 212 A 28 28 0 0 1 232 240 H 88 A 28 28 0 0 1 60 212 V 108 A 28 28 0 0 1 88 80 Z" />
              <path d="M 84 160 H 236" />
              <path d="M 160 80 V 240" />
            </g>
            <path class="fm-sp-flow" d="M 88 80 H 232 A 28 28 0 0 1 260 108 V 212 A 28 28 0 0 1 232 240 H 88 A 28 28 0 0 1 60 212 V 108 A 28 28 0 0 1 88 80 Z" stroke="var(--sp-flow)" stroke-width="2" />
          </g>

          <!-- Waypoints и перекрёстки -->
          <g fill="var(--sp-node)">
            <circle cx="110" cy="80" r="2.5" />
            <circle cx="210" cy="80" r="2.5" />
            <circle cx="110" cy="240" r="2.5" />
            <circle cx="210" cy="240" r="2.5" />
            <circle cx="60" cy="130" r="2.5" />
            <circle cx="60" cy="190" r="2.5" />
            <circle cx="260" cy="130" r="2.5" />
            <circle cx="260" cy="190" r="2.5" />
            <circle cx="160" cy="80" r="3.5" />
            <circle cx="160" cy="240" r="3.5" />
            <circle cx="160" cy="160" r="3.5" />
          </g>

          <!-- Миссии: маршрут прорисовывается перед поездкой челнока -->
          <g fill="none" stroke="var(--sp-accent)" stroke-width="3" stroke-linecap="round">
            <g class="fm-sp-plan fm-sp-plan--x-go"><path d="M 112 160 H 208" pathLength="100" /><circle cx="208" cy="160" r="5" stroke-width="2" /></g>
            <g class="fm-sp-plan fm-sp-plan--x-back"><path d="M 208 160 H 112" pathLength="100" /><circle cx="112" cy="160" r="5" stroke-width="2" /></g>
            <g class="fm-sp-plan fm-sp-plan--y-down"><path d="M 160 112 V 208" pathLength="100" /><circle cx="160" cy="208" r="5" stroke-width="2" /></g>
            <g class="fm-sp-plan fm-sp-plan--y-up"><path d="M 160 208 V 112" pathLength="100" /><circle cx="160" cy="112" r="5" stroke-width="2" /></g>
          </g>

          <!-- Станции: зарядка и погрузка, как в редакторе карт; подсветка — пока робот на станции -->
          <rect class="fm-sp-glow fm-sp-glow--charge" x="66" y="142" width="36" height="36" rx="10" fill="#059669" />
          <rect class="fm-sp-glow fm-sp-glow--load" x="218" y="142" width="36" height="36" rx="10" fill="#ea580c" />
          <g transform="translate(73 149)">
            <rect width="22" height="22" rx="5" fill="#059669" />
            <path d="M12.5 4 L6.5 12.5 H10.5 L9.5 18 L15.5 9.5 H11.5 Z" fill="#fff" />
          </g>
          <g transform="translate(225 149)">
            <rect width="22" height="22" rx="5" fill="#ea580c" />
            <path d="M6 9 L11 5 L16 9 V16 H6 Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" />
            <rect x="9" y="11" width="4" height="5" fill="#fff" />
          </g>
        </svg>
        <img class="fm-sp-robot fm-sp-robot--loop" alt="" />
        <img class="fm-sp-robot fm-sp-robot--loop fm-sp-robot--loop2" data-sprite="robot-loaded.svg" alt="" />
        <img class="fm-sp-robot fm-sp-robot--x" alt="" />
        <img class="fm-sp-robot fm-sp-robot--y" data-sprite="robot-loaded.svg" alt="" />
      </div>

      <div class="fm-sp-brand">
        <span class="fm-sp-word">Compass</span>
        <span class="fm-sp-bar"></span>
        <span class="fm-sp-sub">Fleet<br />Control</span>
      </div>
      <div class="fm-sp-progress"></div>
      <div class="fm-sp-status" id="fm-splash-status">Loading interface</div>
    </div>

    <script>
      ;(function () {
        var el = document.getElementById('fm-splash')
        var status = document.getElementById('fm-splash-status')
        var started = Date.now()
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        // Минимальное время показа заставки, мс.
        var MIN_MS = reduced ? 0 : 5000
        // Картинку робота ставим из скрипта: путь в атрибуте src Vite в dev-режиме
        // портит (base подставляется дважды). data-sprite — робот с паллетой.
        var spriteDir = '%BASE_URL%splash/'
        Array.prototype.forEach.call(el.querySelectorAll('.fm-sp-robot'), function (img) {
          img.onload = function () {
            img.classList.add('is-ready')
          }
          img.src = spriteDir + (img.getAttribute('data-sprite') || 'robot.svg')
        })
        var steps = ['Loading interface', 'Preparing maps', 'Connecting to fleet', 'Dispatching missions']
        var i = 0
        var timer = setInterval(function () {
          i = Math.min(i + 1, steps.length - 1)
          status.textContent = steps[i]
        }, 1100)

        window.__hideSplash = function () {
          window.__hideSplash = function () {}
          var wait = Math.max(0, MIN_MS - (Date.now() - started))
          setTimeout(function () {
            clearInterval(timer)
            el.classList.add('is-leaving')
            setTimeout(function () {
              el.remove()
            }, 500)
          }, wait)
        }
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
