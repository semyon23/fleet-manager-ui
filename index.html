<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fleet-manager/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Manager</title>
    <!-- Runtime-конфиг: правится в dist/config.js без пересборки. Должен грузиться ДО bundle.
         Путь без base: Vite сам добавит /fleet-manager/ и в dev, и в сборке (с %BASE_URL% было бы дважды). -->
    <script src="/config.js"></script>
    <script>
      // GitHub Pages SPA fallback restore — decodes ?/path/... back to /path/...
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script>
      // Тема до первого кадра (та же логика, что в useTheme), чтобы заставка
      // и приложение не мигали белым в тёмной теме.
      ;(function () {
        var mode = 'dark'
        try {
          mode = localStorage.getItem('fm.theme') || 'dark'
        } catch (_) {}
        var dark = mode === 'system'
          ? !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          : mode !== 'light'
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <style>
      html { background-color: #10171f; }
      #app:empty { min-height: 100vh; background-color: #10171f; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
